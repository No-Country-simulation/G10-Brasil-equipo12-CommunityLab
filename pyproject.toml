[tool.pytest.ini_options]
# Permite rodar só "pytest" na raiz: os testes importam o pacote src
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Erros de sintaxe, nomes não usados e ordenação de imports
select = ["E4", "E7", "E9", "F", "I"]
